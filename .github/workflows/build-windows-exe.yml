name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-workpieces
          name: "v0.4.1 — Industrial Workpiece Catalog + Direct 3D Belt Drag-and-Drop + Live PLC Drivers (.exe)"
          body: |
            ### v0.4.1 Deliverable — Standalone Windows `.exe` (`VC-Digital-Twin-Studio-0.4.1-Portable.exe`)
            - **Zero-install Portable Executable:** Download `VC-Digital-Twin-Studio-0.4.1-Portable.exe` below and double-click to launch on Windows 10/11 (x64).
            - **New in `v0.4.1` — Industrial Workpiece Catalog & Direct 3D Conveyor Belt Drag-and-Drop:**
              - **5 Built-in Test Workpieces:** **Carton Box (กล่องพัสดุ)**, **Industrial Pallet (พาเลทสินค้า)**, **KLT Tote Bin (ลังพลาสติก)**, **Cylinder / Canister (ทรงกระบอก/ขวด)**, and **CNC Metal Billet (แผ่นโลหะสำหรับทดสอบ Inductive Proximity Sensor)**.
              - **Zero-Parallax 3D Belt Spline Snapping & Ghost Preview:** Drag any workpiece from the Left Dock and drop it at *any* millimeter along any elevated/curved conveyor spline (`STOPPED`, `PAUSED`, or `RUNNING`) — immediately triggers `Photoelectric` / `Proximity` sensors (`SIM_TO_PLC BOOL`) and queues cleanly without overlapping!
              - **Custom `.GLB` / `OpenUSD` CAD Workpieces:** Use any imported `.glb`, `.gltf`, `.usd`, `.usda`, `.usdc`, or `.usdz` 3D CAD model as a moving product on conveyor belts or continuous `PartSource` feeders.
            - **Includes Full Milestones 1–4 Suite:** glTF/OpenUSD Importer, Component Axis Builder & Force I/O, Spline Accumulation & HSC `DINT`/`REAL` Encoders, and Live `UtilityProcess` PLC Drivers (**Siemens S7-PLCSIM Adv**, **Mitsubishi MELSEC 3E GX Sim3**, **OPC UA**, + **Full I/O Tag Matrix**).
          files: release/*.exe
