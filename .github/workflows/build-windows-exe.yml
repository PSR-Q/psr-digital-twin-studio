name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2-sketchup-floor
          name: "v0.4.2 — SketchUp White / Sky / Dark Viewport Floor Theme Settings + Workpieces (.exe)"
          body: |
            ### v0.4.2 Deliverable — Standalone Windows `.exe` (`VC-Digital-Twin-Studio-0.4.2-Portable.exe`)
            - **Zero-install Portable Executable:** Download `VC-Digital-Twin-Studio-0.4.2-Portable.exe` below and double-click to launch on Windows 10/11 (x64).
            - **New in `v0.4.2` — SketchUp White Floor & Configurable 3D Viewport Theme Settings:**
              - **5 Built-in 3D Viewport & Floor Presets:** **SketchUp White (พื้นขาวคลีน)**, **SketchUp Sky & Ground (ท้องฟ้า + พื้นขาว)**, **CAD Light Gray (พื้นเทาสว่าง)**, **Dark Industrial (พื้นมืดเดิม)**, plus **Custom Sky & Floor Color Pickers**.
              - **SketchUp-Style Extended RGB Origin Axes & Zero-Flicker Floor Grid:** Solid positive `+X` (Red), `+Y` (Green Up), `+Z` (Blue) & dashed negative rays with toggleable Metric Grid in both Top Toolbar (`Floor: White`) and Right Inspector (`VIEWPORT & FLOOR THEME`).
            - **Includes `v0.4.1` Workpiece Catalog & Direct 3D Belt Drag-and-Drop + Full Milestones 1–4 Suite** (glTF/OpenUSD Importer, Component Axis Builder & Force I/O, Spline Accumulation & HSC Encoders, and Live `UtilityProcess` PLC Drivers for Siemens S7, Mitsubishi MELSEC 3E, and OPC UA).
          files: release/*.exe
