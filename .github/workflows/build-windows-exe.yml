name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-milestone2
          name: "Milestone 2 — Component Builder (Linear/Rotary FK) & Signal Force Console (.exe)"
          body: |
            ### Milestone 2 Deliverable — Standalone Windows `.exe`
            - **Zero-install Portable Executable:** Download the `.exe` below and double-click to launch on Windows 10/11 (x64).
            - **Included Features (Milestones 1 + 2):**
              1. Unified `.glb` / `.gltf` & **OpenUSD (`.usd`, `.usda`, `.usdc`, `.usdz`)** 3D importer + magnetic `SnapPort` docking + Scene `.json` Save/Load
              2. **Interactive 3D Component Builder:** Click or double-click any 3D sub-mesh to assign `LinearAxis`, `RotaryAxis`, or `VisualEffect`, configure stroke/angle limits, parent-axis chaining, and live Jog testing
              3. **60–144Hz Zero-Re-Render Forward Kinematics Engine:** Pneumatic cylinders with automatic `DI_ReedRetracted` / `DI_ReedExtended` limits, Trapezoidal Servo positioning (`DI_InPosition`), Continuous RPM rotary motors, Bounded indexing tables, and procedural conveyor belt UV-scrolling
              4. **Signal Force Console (`Force I/O`):** Latching Force ON/OFF switches, momentary `JOG` pushbuttons, analog setpoint sliders, and live 10Hz `SIM_TO_PLC` sensor LEDs without requiring an external PLC
          files: release/*.exe
