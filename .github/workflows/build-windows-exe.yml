name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-milestone3
          name: "Milestone 3 — Spline Conveyors, Zero-Jitter Stopper Queue, Path Sensors & HSC Encoder (.exe)"
          body: |
            ### Milestone 3 Deliverable — Standalone Windows `.exe` (`v0.3.0`)
            - **Zero-install Portable Executable:** Download `VC-Digital-Twin-Studio-0.3.0-Portable.exe` below and double-click to launch on Windows 10/11 (x64).
            - **Included Features (Milestones 1 + 2 + 3):**
              1. **3D Layout & CAD Importer:** `.glb` / `.gltf` & **OpenUSD (`.usd`, `.usda`, `.usdc`, `.usdz`)** importer + Magnetic `SnapPort` docking + `.json` layout Save/Load
              2. **Component Builder & Signal Force Console:** Sub-mesh `LinearAxis` / `RotaryAxis` / `VisualEffect` (RPM belt drive) + 60–144Hz zero-re-render FK engine + standalone `Force I/O` console
              3. **Directed Spline Conveyor Graph & Interactive 3D Path Drawing:** Draw Catmull-Rom / Polyline waypoints directly on 3D belts, auto-route across docked conveyors & rotating 90° Turntables, and spawn/accumulate 3D workpieces behind Pneumatic Stoppers with zero micro-jitter
              4. **Deterministic Sub-Frame Path Sensors & Virtual HSC Encoders:** Live 3D `Photoelectric` laser beam & `Proximity` sensors (`BOOL`) + cumulative 32-bit `Encoder Pulse (DINT)` and `Servo Position / Velocity (REAL)` registers
          files: release/*.exe
