name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-vacuum-gripper
          name: "v0.5.0 — Vacuum Gripper Pick & Transfer + Dual-Lane OpenUSD Gantry (.exe)"
          body: |
            ### v0.5.0 Deliverable — Standalone Windows `.exe` (`VC-Digital-Twin-Studio-0.5.0-Portable.exe`)
            - **Zero-install Portable Executable:** Download `VC-Digital-Twin-Studio-0.5.0-Portable.exe` below and double-click to launch on Windows 10/11 (x64).
            - **New in `v0.5.0` — Vacuum Gripper Pick & Transfer System (`VacuumGripper` Role + Dual-Lane Gantry):**
              - **Dual-Lane OpenUSD Cartesian Pick & Place Cell:** Upgraded `cartesian-gantry-cell.usdz` spans two parallel conveyor lanes (`Z = 0.00 m` Pass/Pick Lane + `Z = +0.80 m` Transfer/Place Lane) with a 4-cup suction manifold (`Vacuum_Gripper_Tool_Axis`) and `-150..+900 mm` servo traverse stroke.
              - **1-Click `Auto Pick & Place` Sequencer + Full PLC I/O Control:** Exposes `DO_AutoCycle`, `DO_VacuumOn`, `AO_PlacePosMm`, `DI_PartPresent`, and `DI_PartGripped` — supporting both 1-click automatic 9-phase Pick & Transfer onto Lane 2 and manual PLC ladder/SFC control (`DO_Extend`, `DO_VacuumOn`, `AO_TargetPosMm`).
              - **Compliant Contact Stop & 6-DOF Carry:** Downward cylinder stroke stops cleanly on top of any workpiece height or belt surface without 3D mesh clipping, carries boxes in 6-DOF mid-air, and hands off deterministically onto any target conveyor spline.
              - **Component Builder `Gripper` Role:** Turn any imported `.glb` or `.usdz` robot/gantry end-effector into an active vacuum suction gripper in seconds.
            - **Includes `v0.4.4` Part Feeder ON/OFF Controls, `v0.4.3` Calibrated Stopper Gate, `v0.4.2` SketchUp White / Dark Themes, `v0.4.1` Workpiece Drag & Drop, and Milestones 1–4 PLC Drivers.**
          files: release/*.exe
