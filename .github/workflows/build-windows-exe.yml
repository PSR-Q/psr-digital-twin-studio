name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-milestone4
          name: "Milestone 4 (Complete Suite) — Live S7 / MELSEC 3E / OPC UA PLC Drivers & Full I/O Tag Matrix (.exe)"
          body: |
            ### Milestone 4 Deliverable — Complete Standalone Windows `.exe` (`v0.4.0`)
            - **Zero-install Portable Executable:** Download `VC-Digital-Twin-Studio-0.4.0-Portable.exe` below and double-click to launch on Windows 10/11 (x64).
            - **Complete Virtual Commissioning Feature Set (Milestones 1 + 2 + 3 + 4):**
              1. **3D Layout & CAD Importer:** `.glb` / `.gltf` & **OpenUSD (`.usd`, `.usda`, `.usdc`, `.usdz`)** importer + Magnetic `SnapPort` docking + `.json` layout Save/Load
              2. **Component Builder & Signal Force Console:** Sub-mesh `LinearAxis` / `RotaryAxis` / `VisualEffect` (RPM belt drive) + 60–144Hz zero-re-render FK engine + standalone `Force I/O` console
              3. **Directed Spline Conveyor Graph & Virtual HSC Encoders:** Catmull-Rom / Polyline 3D paths, zero-jitter Stopper accumulation, sub-frame `Photoelectric` / `Proximity` sensors (`BOOL`), and 32-bit `Encoder Pulse (DINT)` + `Servo Position (REAL)` registers
              4. **Dedicated `UtilityProcess` Live PLC Engine & Full I/O Tag Binding Matrix:**
                 - **Siemens S7 (`SiemensS7Adapter`):** Connects to **S7-PLCSIM Advanced / S7-1500 / S7-1200** via RFC1006 ISO-on-TCP (Port `102`, `I`/`Q`/`M`/`DB`) + PLCSIM Advanced Shared Memory / Pipe Bridge Hook
                 - **Mitsubishi MELSEC (`MitsubishiMcAdapter`):** Connects to **GX Simulator3 / MX Component / iQ-R / Q / FX5U** via **3E Binary MC Protocol** (Batch Read `0401` & Random Write `1402` for `X`/`Y`/`M`/`L`/`B`/`D`/`W`/`R`)
                 - **Omron / CODESYS / Universal (`OpcUaAdapter`):** Connects via **IEC 62541-6 OPC UA Binary TCP (`opc.tcp://`)** (`ns=2;s=...` / `ns=2;i=...`)
                 - **Full-Width I/O Tag Binding Matrix:** 1-click vendor auto-addressing presets, CSV Tag Table Import/Export, `Scale` & `Offset` linear engineering scaling, live syntax validation, and bidirectional Manual Force Overrides
          files: release/*.exe
