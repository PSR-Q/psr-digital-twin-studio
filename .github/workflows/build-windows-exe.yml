name: Build Standalone Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy-web-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sample industrial .glb models
        run: npm run generate:glbs

      - name: Verify strict TypeScript schemas & build Renderer + Electron Worker
        run: npm run build:all

      - name: Package single standalone Windows .exe via electron-builder
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSR-Digital-Twin-Studio-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error

      - name: Publish Standalone .exe to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.3-stopper-gate
          name: "v0.4.3 — Calibrated Under-Belt Pop-Up Stopper Gate & Conveyor-Flush OpenUSD Portal (.exe)"
          body: |
            ### v0.4.3 Deliverable — Standalone Windows `.exe` (`VC-Digital-Twin-Studio-0.4.3-Portable.exe`)
            - **Zero-install Portable Executable:** Download `VC-Digital-Twin-Studio-0.4.3-Portable.exe` below and double-click to launch on Windows 10/11 (x64).
            - **New in `v0.4.3` — Calibrated Conveyor-Level Stopper Gate & OpenUSD Portal Geometry:**
              - **Under-Belt Pop-Up `Pneumatic Blade Stopper` (`0.78m` Pass-Through Deck):** Cylinder barrel tucked cleanly underneath the conveyor; retracted (`0 mm`) stopper blade sits `5 mm` below the `0.80m` belt surface so workpieces glide smoothly across, and extended (`+95 mm`) pops up to `0.888m` with zero under-blade gap.
              - **Lowered Conveyor-Integrated `Cartesian Pick & Place (OpenUSD)`:** Portal height lowered from `1.63m` to `1.30m` with a built-in `0.78m` `Pass_Conveyor_Bed` & side rails (eliminating floating mid-air gaps when docked between conveyors) and calibrated `165 mm` vertical mast stroke down to the `0.80m` belt surface.
            - **Includes `v0.4.2` SketchUp White / Sky / Dark Viewport Themes, `v0.4.1` Workpiece Catalog & Belt Drag-and-Drop, and Full Milestones 1–4 Suite.**
          files: release/*.exe
